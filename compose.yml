services:
  traefik:
    image: traefik:v3.7.10
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik_static.yml:/etc/traefik/traefik_static.yml:ro
      - ./traefik/traefik_dynamic.yml:${TRAEFIK_DYNAMIC_CONF}:ro
      - ./traefik/entrypoint.sh:/entrypoint.sh:ro
      - ./traefik/logs:/logs
      - /etc/localtime:/etc/localtime:ro
      - traefik_certs:/acme
    environment:
      - LOG_LEVEL=info # Increasing logs (default is warning)
      - DEBUG_MODE=false
      - DOMAIN
      - LETSENCRYPT_EMAIL
      - TRAEFIK_DYNAMIC_CONF
      - OVH_ENDPOINT=ovh-eu
      - OVH_APPLICATION_KEY
      - OVH_APPLICATION_SECRET
      - OVH_CONSUMER_KEY
    ports:
      - 443:443
    labels:
      traefik.enable: true
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: authelia@file,errp-redirect@file
    depends_on:
      cs:
        condition: service_started
      errp:
        condition: service_healthy
      authelia:
        condition: service_healthy

  authelia:
    image: authelia/authelia:4.39.20
    security_opt:
      - no-new-privileges:true
    environment:
      - AUTHELIA_STORAGE_ENCRYPTION_KEY
      - DOMAIN
      - X_AUTHELIA_CONFIG_FILTERS=template # For dynamic use of "env"
    volumes:
      - ./authelia/config:/config
    labels:
      traefik.enable: true

  glances:
    image: nicolargo/glances:4.5.6
    volumes:
      - ./glances/glances.conf:/etc/glances/glances.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - GLANCES_OPT=-w --bind ${DOCKER_GATEWAY_IP}
    labels:
      traefik.enable: true
      traefik.http.routers.glances.middlewares: authelia@file,errp-redirect@file
      traefik.http.services.glances.loadbalancer.server.url: http://${DOCKER_GATEWAY_IP}:61208
    network_mode: host
    pid: host

  portainer:
    image: portainer/portainer-ce:2.44.0
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      traefik.enable: true
      traefik.http.services.portainer.loadbalancer.server.port: 9000
      traefik.http.routers.portainer.middlewares: errp-redirect@file
    command: ["--admin-password", "${PORTAINER_ADMIN_PASSWORD}"]
    ports:
      - 127.0.0.1:9000:9000 # Necessary for HA, which is not on the same network

  ha:
    image: ghcr.io/home-assistant/home-assistant:2026.8.2
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./ha/config:/config
      - ./ha/scripts:/scripts:ro
    network_mode: host # Necessary for MDNS discovery
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SUBNET_IP
      - YOUTUBE_STREAM_LOG_FILE
      - YOUTUBE_STREAM_KEY
      - INTERNAL_URL=http://${SERVER_IP}:8123
      - EXTERNAL_URL=https://ha.${DOMAIN}
    labels:
      traefik.enable: true
      traefik.http.services.ha.loadbalancer.server.url: http://${DOCKER_GATEWAY_IP}:8123
      traefik.http.routers.ha.middlewares: errp-redirect@file
    depends_on:
      mosquitto:
        condition: service_healthy

  z2m:
    image: koenkk/zigbee2mqtt:2.13.0
    security_opt:
      - no-new-privileges:true
    volumes:
      - z2m_data:/app/data
    devices:
      - /dev/serial/by-id/${ZIGBEE_USB}:/dev/ttyUSB0
    environment:
      - ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL=warning # Decreasing logs (default is info)
    labels:
      traefik.enable: true
      traefik.http.routers.z2m.middlewares: authelia@file,errp-redirect@file
      traefik.http.services.z2m.loadbalancer.server.port: 8080
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MQTT_LAN_USER
      - MQTT_LAN_PASSWORD
    entrypoint: /entrypoint.sh
    healthcheck:
      test: mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -i healthcheck -W 3
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s
      start_interval: 2s
    ports:
      - 127.0.0.1:1883:1883 # Necessary for HA, which is not on the same network
      - 8883:8883 # Local network access with authentication

  vw:
    image: vaultwarden/server:1.37.1
    security_opt:
      - no-new-privileges:true
    volumes:
      - vw_data:/data
      - /etc/localtime:/etc/localtime:ro
    env_file: ./vw/.env # Static configuration
    environment: # Dynamic configuration
      - DOMAIN=https://vw.${DOMAIN}
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - PUSH_INSTALLATION_ID
      - PUSH_INSTALLATION_KEY
    healthcheck:
      start_period: 5s
    labels:
      traefik.enable: true
      traefik.http.routers.vw.middlewares: secure-headers@file

  errp:
    image: ghcr.io/tarampampam/error-pages:4.2.4
    security_opt:
      - no-new-privileges:true
    environment:
      - TEMPLATE_NAME=shuffle #cats,win98,shuffle,connection
    labels:
      traefik.enable: true
      traefik.http.routers.errp.middlewares: errp-redirect@file
      # Fallback router
      traefik.http.routers.errp.rule: HostRegexp(`.+`)
      traefik.http.routers.errp.priority: 10
      traefik.http.services.errp.loadbalancer.server.port: 8080

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    stop_grace_period: 30s # Frigate is long to quit
    shm_size: "256mb"
    privileged: true # Necessary for GPU acceleration
    extra_hosts:
      - "tapo-c200:${FRIGATE_TAPO_C200_IP}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # Necessary for HA integration (which is not on the same network)
      - 127.0.0.1:5000:5000 # Dangerous unauthenticated internal API
      - 127.0.0.1:8554:8554 # RTSP from go2rtc
      # WebRTC, for direct access to camera streams
      - 8555:8555
      - 8555:8555/udp
    labels:
      traefik.enable: true
      # Frigate UI (port 8971)
      traefik.http.routers.frigate.service: frigate
      traefik.http.routers.frigate.middlewares: authelia@file,errp-redirect@file
      traefik.http.services.frigate.loadbalancer.server.port: 5000
      # go2rtc UI (port 1984)
      traefik.http.routers.go2rtc.rule: Host(`go2rtc.${DOMAIN}`)
      traefik.http.routers.go2rtc.service: go2rtc
      traefik.http.routers.go2rtc.middlewares: authelia@file,errp-redirect@file
      traefik.http.services.go2rtc.loadbalancer.server.port: 1984
    environment:
      - WEBRTC_LOCAL_CANDIDATE=${SERVER_IP}:8555
      - FRIGATE_TAPO_C200_USER
      - FRIGATE_TAPO_C200_PASSWORD
      - FRIGATE_TAPO_C200_CLOUD_PASSWORD
    depends_on:
      mosquitto:
        condition: service_healthy

  immich:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri # VAAPI-accelerated video transcoding (shared with frigate)
    volumes:
      - ./immich/media:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immichdb
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immichredis
      - IMMICH_MACHINE_LEARNING_URL=http://immichml:3003
    labels:
      traefik.enable: true
      # No authelia/errp-redirect: the mobile app hits the API directly and needs raw JSON errors (see vw)
      traefik.http.routers.immich.middlewares: secure-headers@file
      traefik.http.services.immich.loadbalancer.server.port: 2283
    depends_on:
      immichdb:
        condition: service_healthy
      immichredis:
        condition: service_healthy

  immichml:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri # OpenVINO inference on the Intel iGPU (shared with frigate)
    volumes:
      - immichml_cache:/cache
    mem_limit: ${IMMICH_ML_MEM}

  immichredis:
    image: docker.io/valkey/valkey:9.1.1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: redis-cli ping || exit 1

  immichdb:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    security_opt:
      - no-new-privileges:true
    shm_size: "128mb"
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immichdb_data:/var/lib/postgresql/data

  grdf:
    image: ssenart/gazpar2mqtt:0.2.5
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./grdf/log:/app/log
    environment:
      - GRDF_USERNAME
      - GRDF_PASSWORD
      - GRDF_PCE_IDENTIFIER
      - MQTT_BROKER=mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy

  cs:
    image: crowdsecurity/crowdsec:v1.7.8-debian
    security_opt:
      - no-new-privileges:true
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - ./cs/config:/etc/crowdsec
      # Logs
      - ./traefik/logs:/logs/traefik:ro
      - ./authelia/config/authelia.log:/logs/authelia.log:ro
      - /var/log/journal:/run/log/journal:ro
    ports:
      - 127.0.0.1:8080:8080 # For firewall bouncer on host
    environment:
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/sshd LePresidente/authelia
    depends_on:
      authelia: # Necessary for authelia.log to be created
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:v2026.8.13
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: true
      # Double auth (Authelia + Hermes basic auth) — mandatory, see commit.
      traefik.http.routers.hermes.middlewares: authelia@file,errp-redirect@file
      traefik.http.services.hermes.loadbalancer.server.port: 9119
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET
    command: gateway run
    volumes:
      - hermes_data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro

  openwu:
    image: ghcr.io/open-webui/open-webui:v0.11.0-ollama
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: true
      traefik.http.routers.openwu.middlewares: errp-redirect@file
      traefik.http.services.openwu.loadbalancer.server.port: 8080
    environment:
      - WEBUI_AUTH=true
      - WEBUI_URL=https://openwu.${DOMAIN}
      - OLLAMA_BASE_URLS=http://localhost:11434;http://${DOCKER_GATEWAY_IP}:11434
      # Config file first: runtime UI changes are not persisted on restart, ensuring reproducibility
      - ENABLE_PERSISTENT_CONFIG=false
      - ENABLE_SIGNUP=false
    volumes:
      - ollama_datas:/root/.ollama
      - open_webui_datas:/app/backend/data
    cpus: ${OPENWU_CPUS}
    mem_limit: ${OPENWU_MEM}

  gharunner:
    image: ghcr.io/myoung34/docker-github-actions-runner:2.336.0-debian-bookworm
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOCAL_PATH}:${LOCAL_PATH} # same path both sides — compose's relative paths are resolved by the host's Docker daemon
    environment:
      - RUNNER_SCOPE=repo
      - RUNNER_NAME=home-srv-runner
      - LABELS=home-srv-runner
      - DISABLE_AUTO_UPDATE=true # pinned above, tracked by Renovate
      - ACCESS_TOKEN=${RUNNER_ACCESS_TOKEN}
      - REPO_URL
      - LOCAL_PATH

volumes:
  vw_data:
  portainer_data:
  z2m_data:
  traefik_certs:
  crowdsec_data:
  hermes_data:
  ollama_datas:
  open_webui_datas:
  immichdb_data:
  immichml_cache:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_IP}
