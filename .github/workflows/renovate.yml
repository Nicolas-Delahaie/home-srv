name: Renovate

# Runs on ubuntu-latest, not the self-hosted runner: Renovate never needs server/Docker access.
on:
  schedule:
    - cron: "0 5 * * 3,0"
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: renovatebot/github-action@v41.0.5
        with:
          configurationFile: renovate.json
          token: "${{ secrets.RENOVATE_TOKEN }}"
