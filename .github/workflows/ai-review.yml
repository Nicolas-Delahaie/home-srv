name: AI changelog review

# Queued on Renovate PRs only when manually labeled with 'ai-review' to avoid unnecessary AI quota consumption.
# Runs on ubuntu-latest — no server access needed.
on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  review:
    if: |
      startsWith(github.head_ref, 'renovate/') &&
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Gather PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Sections are truncated: the weekly grouped PR bundles every image's changelog and would
        # otherwise blow past the prompt size accepted by Copilot CLI.
        run: |
          {
            echo "## PR title/body (upstream changelogs)"
            gh pr view "$PR_NUMBER" --json title,body -q '.title + "\n\n" + .body' | head -c 40000
            echo
            echo "## Diff"
            gh pr diff "$PR_NUMBER" | head -c 10000
            echo
            echo "## compose.yml (how this repo uses the images)"
            cat compose.yml
          } > /tmp/pr-context.txt

      - uses: actions/setup-node@v7
        with:
          # Copilot CLI requires Node >= 22
          node-version: 24

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run AI review
        id: inference
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: "" # empty = Copilot CLI picks its own default model
          system-prompt: >
            You are reviewing a Renovate dependency bump for a self-hosted Docker Compose home server.
            You are given the PR title/body (with the upstream changelog), the diff (usually just a changed
            image tag) and the current compose.yml. Compare the changelog to how this repo actually uses the
            image (service definition, env vars, volumes, labels) and flag concrete risks: breaking config
            changes, removed/renamed env vars, changed defaults, deprecated features in use here. Be concise.
            If nothing looks risky, say so plainly instead of inventing concerns.
          prompt-file: /tmp/pr-context.txt

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW: ${{ steps.inference.outputs.response }}
        run: gh pr comment "$PR_NUMBER" --body "$REVIEW"
