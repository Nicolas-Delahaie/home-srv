name: Deploy

# Deploys only when a Renovate PR is merged into main — manual pushes/merges never trigger it.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'renovate/')
    runs-on: [self-hosted, home-srv-runner]
    steps:
      # No checkout — the real clone is already bind-mounted at $LOCAL_PATH.
      - name: Pull and redeploy
        run: |
          cd "$LOCAL_PATH"
          # safe.directory: the repo is owned by the host user, not the runner's
          git -c safe.directory="$LOCAL_PATH" pull --ff-only
          # Every service but gharunner: redeploying it would destroy the container running this job.
          docker compose config --services | grep -v '^gharunner$' | xargs -r docker compose up -d --build
          docker image prune -f
